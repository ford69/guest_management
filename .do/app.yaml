name: winston-pokua-wedding-api
static_sites:
  - name: wedding-rsvp
    github:
      branch: main
      deploy_on_push: true
      repo: REPLACE_WITH_YOUR_REPOSITORY
    source_dir: /app
    routes:
      - path: /
services:
  - name: api
    github:
      branch: main
      deploy_on_push: true
      repo: REPLACE_WITH_YOUR_REPOSITORY
    source_dir: /server
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    routes:
      - path: /api
      - path: /health
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: FRONTEND_ORIGIN
        scope: RUN_TIME
        value: REPLACE_WITH_STATIC_SITE_URL
